include: package:flutter_lints/flutter.yaml

linter:
  rules:
    # Error rules
    always_declare_return_types: true
    avoid_empty_else: true
    avoid_relative_lib_imports: true
    avoid_slow_async_io: true
    avoid_type_to_string: true
    avoid_unnecessary_containers: true
    cancel_subscriptions: true
    close_sinks: true
    no_duplicate_case_values: true
    prefer_const_constructors: true
    prefer_const_constructors_in_immutables: true
    prefer_const_declarations: true
    prefer_const_literals_to_create_immutables: true
    prefer_final_fields: true
    prefer_final_locals: true
    prefer_single_quotes: true
    require_trailing_commas: true
    unawaited_futures: true
    use_build_context_synchronously: true
    use_key_in_widget_constructors: true

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    # integration_test/ uses nested pubspec (see integration_test/pubspec.yaml)
    - "integration_test/**"
  errors:
    invalid_annotation_target: ignore
    todo: ignore
    avoid_print: ignore
    deprecated_member_use: ignore
    use_build_context_synchronously: ignore
    unawaited_futures: ignore
    curly_braces_in_flow_control_structures: ignore
    unintended_html_in_doc_comment: ignore
    package_names: ignore
    # CI: do not fail builds on style-only const suggestions
    prefer_const_constructors: warning
    prefer_const_constructors_in_immutables: warning
    prefer_const_declarations: warning
    prefer_const_literals_to_create_immutables: warning
  strong-mode:
    implicit-casts: false
    implicit-dynamic: false
